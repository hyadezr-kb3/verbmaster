    <title>Verb Master</title>
    
    <!-- === LOGO 設定 === -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;

            -webkit-touch-callout: none;
            -webkit-user-select: none;

        }

</head>
<body class="bg-gray-100 touch-pan-y">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const Volume2 = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>

        );
        const ArrowLeft = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="19" y1="12" x2="5" y2="12"></line>

        const Delete = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                <line x1="18" y1="9" x2="12" y2="15"></line>
                <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
        );
        const Check = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        );
        const Trophy = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
            </svg>
        );

        // --- Data Library (Complete 1-100) ---
        const VERB_DATA = {
          "Day 1": [
            { present: "bang", past: "banged", participle: "banging" },
            { present: "bark", past: "barked", participle: "barking" },
            { present: "boil", past: "boiled", participle: "boiling" },
            { present: "climb", past: "climbed", participle: "climbing" },

          ],

            { present: "dance", past: "danced", participle: "dancing" },
            { present: "finish", past: "finished", participle: "finishing" },

          ],
          "Day 3": [

            { present: "help", past: "helped", participle: "helping" },
            { present: "laugh", past: "laughed", participle: "laughing" },
            { present: "listen", past: "listened", participle: "listening" },
            { present: "look", past: "looked", participle: "looking" }
          ],
          "Day 4": [
            { present: "jump", past: "jumped", participle: "jumping" },
            { present: "open", past: "opened", participle: "opening" },
            { present: "pack", past: "packed", participle: "packing" },
            { present: "paint", past: "painted", participle: "painting" },
            { present: "pick", past: "picked", participle: "picking" }
          ],
          "Day 5": [
            { present: "play", past: "played", participle: "playing" },
            { present: "point", past: "pointed", participle: "pointing" },
            { present: "pull", past: "pulled", participle: "pulling" },
            { present: "push", past: "pushed", participle: "pushing" },
            { present: "roll", past: "rolled", participle: "rolling" }
          ],
          "Day 6": [
            { present: "shout", past: "shouted", participle: "shouting" },
            { present: "show", past: "showed", participle: "showing" },
            { present: "snore", past: "snored", participle: "snoring" },
            { present: "stay", past: "stayed", participle: "staying" },
            { present: "stop", past: "stopped", participle: "stopping" }
          ],
          "Day 7": [
            { present: "study", past: "studied", participle: "studying" },
            { present: "talk", past: "talked", participle: "talking" },
            { present: "trip", past: "tripped", participle: "tripping" },
            { present: "try", past: "tried", participle: "trying" },
            { present: "want", past: "wanted", participle: "wanting" }
          ],
          "Day 8": [
            { present: "wash", past: "washed", participle: "washing" },
            { present: "watch", past: "watched", participle: "watching" },
            { present: "beat", past: "beat", participle: "beating" },
            { present: "begin", past: "began", participle: "beginning" },
            { present: "bite", past: "bit", participle: "biting" }
          ],
          "Day 9": [
            { present: "blow", past: "blew", participle: "blowing" },
            { present: "break", past: "broke", participle: "breaking" },
            { present: "bring", past: "brought", participle: "bringing" },
            { present: "buy", past: "bought", participle: "buying" },
            { present: "catch", past: "caught", participle: "catching" }
          ],
          "Day 10": [
            { present: "come", past: "came", participle: "coming" },
            { present: "draw", past: "drew", participle: "drawing" },
            { present: "drink", past: "drank", participle: "drinking" },
            { present: "eat", past: "ate", participle: "eating" },
            { present: "fall", past: "fell", participle: "falling" }
          ],
          "Day 11": [
            { present: "feel", past: "felt", participle: "feeling" },
            { present: "fight", past: "fought", participle: "fighting" },
            { present: "find", past: "found", participle: "finding" },
            { present: "fly", past: "flew", participle: "flying" },
            { present: "get", past: "got", participle: "getting" }
          ],
          "Day 12": [
            { present: "give", past: "gave", participle: "giving" },
            { present: "go", past: "went", participle: "going" },
            { present: "grow", past: "grew", participle: "growing" },
            { present: "have", past: "had", participle: "having" },
            { present: "hear", past: "heard", participle: "hearing" }
          ],
          "Day 13": [
            { present: "hide", past: "hid", participle: "hiding" },
            { present: "hit", past: "hit", participle: "hitting" },
            { present: "hurt", past: "hurt", participle: "hurting" },
            { present: "learn", past: "learned", participle: "learning" },
            { present: "leave", past: "left", participle: "leaving" }
          ],
          "Day 14": [
            { present: "lose", past: "lost", participle: "losing" },
            { present: "keep", past: "kept", participle: "keeping" },
            { present: "kneel", past: "knelt", participle: "kneeling" },
            { present: "know", past: "knew", participle: "knowing" },
            { present: "make", past: "made", participle: "making" }
          ],
          "Day 15": [
            { present: "pay", past: "paid", participle: "paying" },
            { present: "put", past: "put", participle: "putting" },
            { present: "read", past: "read", participle: "reading" },
            { present: "ride", past: "rode", participle: "riding" },
            { present: "ring", past: "rang", participle: "ringing" }
          ],
          "Day 16": [
            { present: "rise", past: "rose", participle: "rising" },
            { present: "run", past: "ran", participle: "running" },
            { present: "say", past: "said", participle: "saying" },
            { present: "see", past: "saw", participle: "seeing" },
            { present: "sell", past: "sold", participle: "selling" }
          ],
          "Day 17": [
            { present: "send", past: "sent", participle: "sending" },
            { present: "sit", past: "sat", participle: "sitting" },
            { present: "sing", past: "sang", participle: "singing" },
            { present: "sleep", past: "slept", participle: "sleeping" },
            { present: "smell", past: "smelled", participle: "smelling" }
          ],
          "Day 18": [
            { present: "speak", past: "spoke", participle: "speaking" },
            { present: "spell", past: "spelled", participle: "spelling" },
            { present: "stand", past: "stood", participle: "standing" },
            { present: "swim", past: "swam", participle: "swimming" },
            { present: "swing", past: "swung", participle: "swinging" }
          ],
          "Day 19": [
            { present: "take", past: "took", participle: "taking" },
            { present: "teach", past: "taught", participle: "teaching" },
            { present: "tear", past: "tore", participle: "tearing" },
            { present: "tell", past: "told", participle: "telling" },
            { present: "think", past: "thought", participle: "thinking" }
          ],
          "Day 20": [
            { present: "throw", past: "threw", participle: "throwing" },
            { present: "understand", past: "understood", participle: "understanding" },
            { present: "wake", past: "woke", participle: "waking" },
            { present: "wear", past: "wore", participle: "wearing" },
            { present: "write", past: "wrote", participle: "writing" }
          ]
        };

        const FIELDS = [
          { key: 'present', label: 'Present' },
          { key: 'past', label: 'Past' },
          { key: 'participle', label: 'P. Participle' }
        ];

        function App() {
          const [view, setView] = useState('menu'); 
          const [selectedDay, setSelectedDay] = useState(null);
          const [currentVerbIndex, setCurrentVerbIndex] = useState(0);
          
          // State
          const [userSpellings, setUserSpellings] = useState({ present: "", past: "", participle: "" });
          const [activeField, setActiveField] = useState('present'); 
          const [fieldStatus, setFieldStatus] = useState({ present: "idle", past: "idle", participle: "idle" }); 
          // New: Cursor position for each field
          const [cursorPositions, setCursorPositions] = useState({ present: 0, past: 0, participle: 0 });
          
          const [letterPool, setLetterPool] = useState([]);
          const [isAllCorrect, setIsAllCorrect] = useState(false);
          
          const scrollContainerRef = useRef(null);

          const currentDayList = selectedDay ? VERB_DATA[selectedDay] : [];
          const currentVerbObj = currentDayList[currentVerbIndex];

          useEffect(() => {
            if (view === 'game' && currentVerbObj) {
              if (!currentVerbObj.present) {
                alert("This day has no verbs yet!");
                setView('menu');
                return;
              }
              generateLetterPool();
              setUserSpellings({ present: "", past: "", participle: "" });
              // Reset cursors to 0
              setCursorPositions({ present: 0, past: 0, participle: 0 });
              setFieldStatus({ present: "idle", past: "idle", participle: "idle" });
              setActiveField('present');
              setIsAllCorrect(false);
              
              if(scrollContainerRef.current) {
                scrollContainerRef.current.scrollTop = 0;
              }
            }
          }, [currentVerbIndex, view, selectedDay]);

          const generateLetterPool = () => {
            if (!currentVerbObj || !currentVerbObj.present) return;

            const presentLetters = currentVerbObj.present.split('');
            const pastLetters = currentVerbObj.past.split('');
            const partLetters = currentVerbObj.participle.split('');
            
            const alphabet = "abcdefghijklmnopqrstuvwxyz";
            const randomLetters = Array.from({ length: 3 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]);

            const allSourceLetters = [
              ...presentLetters, 
              ...pastLetters, 
              ...partLetters, 
              ...randomLetters
            ];
            
            const uniqueLetters = Array.from(new Set(allSourceLetters));
            const shuffled = uniqueLetters.sort(() => Math.random() - 0.5);
            setLetterPool(shuffled);
          };

          const speakWord = (text) => {
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; 
            window.speechSynthesis.speak(utterance);
          };

          // --- Input Logic ---

          const handleContainerClick = (fieldKey) => {
            setActiveField(fieldKey);
            // Clicking empty space sets cursor to the end
            setCursorPositions(prev => ({
                ...prev,
                [fieldKey]: userSpellings[fieldKey].length
            }));
          };

          const handleCharClick = (e, fieldKey, index) => {
            e.stopPropagation(); // Stop bubbling to container
            setActiveField(fieldKey);
            // Clicking a character sets cursor BEFORE that character (index)
            // Or AFTER? Standard mobile behavior: tap 'A' puts cursor next to 'A'.
            // Let's set it to index (before the clicked char) so he can fix IT.
            // Actually, setting it to index (before) allows inserting at start easily.
            setCursorPositions(prev => ({
                ...prev,
                [fieldKey]: index
            }));
          };

          const handleLetterClick = (letter) => {
            if (isAllCorrect) return;
            
            setUserSpellings(prev => {
              const currentStr = prev[activeField];
              const cursorPos = cursorPositions[activeField];
              
              // Insert letter at cursor position
              const newStr = currentStr.slice(0, cursorPos) + letter + currentStr.slice(cursorPos);
              return { ...prev, [activeField]: newStr };
            });

            // Move cursor forward
            setCursorPositions(prev => ({
                ...prev,
                [activeField]: prev[activeField] + 1
            }));
            
            setFieldStatus(prev => ({ ...prev, [activeField]: 'idle' }));
          };

          const handleBackspace = () => {
            if (isAllCorrect) return;
            
            const cursorPos = cursorPositions[activeField];
            if (cursorPos === 0) return; // Nothing to delete at start

            setUserSpellings(prev => {
              const currentStr = prev[activeField];
              // Delete char BEFORE cursor
              const newStr = currentStr.slice(0, cursorPos - 1) + currentStr.slice(cursorPos);
              return { ...prev, [activeField]: newStr };
            });

            // Move cursor back
            setCursorPositions(prev => ({
                ...prev,
                [activeField]: cursorPos - 1
            }));

            setFieldStatus(prev => ({ ...prev, [activeField]: 'idle' }));
          };

          const checkAllAnswers = () => {
            const newStatus = {};
            let allGood = true;

            FIELDS.forEach(({ key }) => {
              const target = currentVerbObj[key];
              const input = userSpellings[key];
              
              if (input.toLowerCase() === target.toLowerCase()) {
                newStatus[key] = 'correct';
              } else {
                newStatus[key] = 'wrong';
                allGood = false;
              }
            });

            setFieldStatus(newStatus);

            if (allGood) {
              setIsAllCorrect(true);
              const utterance = new SpeechSynthesisUtterance("Great job!");
              utterance.rate = 1.2;
              window.speechSynthesis.speak(utterance);
              setTimeout(nextVerb, 1500);
            } else {
              if (navigator.vibrate) navigator.vibrate(200);
              const firstWrong = FIELDS.find(f => newStatus[f.key] === 'wrong');
              if (firstWrong) {
                setActiveField(firstWrong.key);
                // On error, reset cursor to end for convenience? Or keep it? 
                // Let's keep it at end to continue typing.
                setCursorPositions(prev => ({
                    ...prev,
                    [firstWrong.key]: userSpellings[firstWrong.key].length
                }));
              }
            }
          };

          const nextVerb = () => {
            if (currentVerbIndex < currentDayList.length - 1) {
              setCurrentVerbIndex(prev => prev + 1);
            } else {
              setView('complete');
            }
          };

          const startDay = (day) => {
            setSelectedDay(day);
            setCurrentVerbIndex(0);
            setView('game');
          };

          const goHome = () => {
            setView('menu');
            setSelectedDay(null);
          };

          if (view === 'menu') {
            return (
              <div className="min-h-screen bg-blue-50 flex flex-col items-center p-6 font-sans">
                <h1 className="text-3xl font-bold text-blue-600 mb-2">Verb Master</h1>
                <p className="text-gray-600 mb-6">Daily Spelling Drill</p>
                <div className="w-full max-w-md overflow-y-auto max-h-[70vh] pb-10 px-2 no-scrollbar">
                  <div className="grid grid-cols-3 gap-3">
                    {Object.keys(VERB_DATA).map(day => {
                      const count = VERB_DATA[day].filter(v => v.present).length;
                      return (
                        <button key={day} onClick={() => startDay(day)} className={`p-4 rounded-xl shadow-sm active:scale-95 transition-transform border-b-4 flex flex-col items-center justify-center gap-1 ${count > 0 ? 'bg-white border-blue-200 hover:bg-blue-50' : 'bg-gray-100 border-gray-200 opacity-60'}`}>
                          <span className="text-lg font-bold text-gray-700">{day.replace('Day ', '')}</span>
                          <span className="text-[10px] text-gray-400">{count > 0 ? `${count} verbs` : 'Empty'}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            );
          }

          if (view === 'complete') {
            return (
              <div className="min-h-screen bg-yellow-50 flex flex-col items-center justify-center p-6 text-center">
                <Trophy size={80} className="text-yellow-500 mb-4 animate-bounce" />
                <h2 className="text-3xl font-bold text-gray-800 mb-2">Complete!</h2>
                <p className="text-gray-600 mb-8">You finished all verbs for {selectedDay}.</p>
                <button onClick={goHome} className="bg-blue-500 text-white px-8 py-3 rounded-full font-bold shadow-lg active:scale-95">Back to Menu</button>
              </div>
            );
          }

          // Game View
          return (
            <div className="min-h-screen bg-gray-50 flex flex-col font-sans max-w-md mx-auto relative">
              <div className="bg-white p-4 shadow-sm flex items-center justify-between sticky top-0 z-10">
                <button onClick={goHome} className="p-2 rounded-full hover:bg-gray-100"><ArrowLeft size={24} className="text-gray-600" /></button>
                <div className="flex flex-col items-center">
                  <span className="font-bold text-gray-800">{selectedDay}</span>
                  <span className="text-xs text-gray-500">Verb {currentVerbIndex + 1} / {currentDayList.length}</span>
                </div>
                <div className="w-10"></div>
              </div>

              <div className="w-full h-1.5 bg-gray-200">
                <div className="h-full bg-blue-500 transition-all duration-300" style={{ width: `${((currentVerbIndex) / currentDayList.length) * 100}%` }}></div>
              </div>

              <div ref={scrollContainerRef} className="flex-1 p-4 flex flex-col items-center overflow-y-auto pb-64 no-scrollbar"> 
                <div className="mb-6 flex flex-col items-center gap-2 mt-4">
                   <button onClick={() => speakWord(currentVerbObj?.present)} className="bg-blue-100 hover:bg-blue-200 text-blue-600 p-5 rounded-full shadow-sm transition-transform active:scale-95 flex items-center justify-center">
                      <Volume2 size={32} />
                   </button>
                   <span className="text-xs text-gray-400">Tap to listen</span>
                </div>

                <div className="w-full flex flex-col gap-3 mb-6">
                  {FIELDS.map((field) => {
                    const isActive = activeField === field.key;
                    const cursorPos = cursorPositions[field.key];
                    const spelling = userSpellings[field.key];
                    
                    return (
                        <div key={field.key} className="flex flex-col">
                          <span className="text-xs font-semibold text-gray-500 mb-1 ml-1 uppercase">{field.label}</span>
                          <div 
                            onClick={() => handleContainerClick(field.key)}
                            className={`
                              relative min-h-[60px] h-auto py-2 flex items-center px-4 rounded-xl border-2 transition-all cursor-text bg-white
                              ${isActive ? 'border-blue-400 ring-2 ring-blue-100' : 'border-gray-200'}
                              ${fieldStatus[field.key] === 'correct' ? 'border-green-400 bg-green-50' : ''}
                              ${fieldStatus[field.key] === 'wrong' ? 'border-red-400 bg-red-50' : ''}
                            `}
                          >
                            <div className="flex flex-wrap gap-0 w-full items-center">
                                {/* Rendering Loop for Characters and Cursor */}
                                {spelling.split('').map((char, idx) => (
                                    <React.Fragment key={idx}>
                                        {/* Cursor before char if active and index matches */}
                                        {isActive && !isAllCorrect && cursorPos === idx && (
                                            <span className="w-0.5 h-6 bg-blue-500 animate-pulse -mx-[1px] z-10"></span>
                                        )}
                                        
                                        <span 
                                            onClick={(e) => handleCharClick(e, field.key, idx)}
                                            className="text-2xl font-bold text-gray-800 px-0.5 min-w-[10px] text-center select-none"
                                        >
                                            {char}
                                        </span>
                                    </React.Fragment>
                                ))}
                                
                                {/* Cursor at the very end */}
                                {isActive && !isAllCorrect && cursorPos === spelling.length && (
                                    <span className="w-0.5 h-6 bg-blue-500 animate-pulse ml-0.5"></span>
                                )}
                                
                                {/* Placeholder */}
                                {spelling.length === 0 && !isActive && (
                                    <span className="text-gray-300 text-base italic">Tap to spell...</span>
                                )}
                            </div>
                            
                            {fieldStatus[field.key] === 'correct' && <Check size={18} className="text-green-500 ml-auto shrink-0" />}
                          </div>
                        </div>
                    );
                  })}
                </div>

                <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-4 max-w-md mx-auto z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                  <div className="w-full grid grid-cols-7 gap-1.5 mb-3">
                    {letterPool.map((letter, idx) => (
                      <button key={`${letter}-${idx}`} onClick={() => handleLetterClick(letter)} className="aspect-square bg-gray-50 border border-gray-200 active:bg-gray-200 rounded-md text-lg font-bold text-gray-700 shadow-sm flex items-center justify-center transition-all no-select">
                        {letter}
                      </button>
                    ))}
                  </div>
                  <div className="flex gap-3 w-full">
                    <button onClick={handleBackspace} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors">
                      <Delete size={20} /> Del
                    </button>
                    <button onClick={checkAllAnswers} className={`flex-[2] py-3 rounded-xl font-bold text-white flex items-center justify-center gap-2 transition-all shadow-lg ${isAllCorrect ? 'bg-green-500' : 'bg-blue-500 hover:bg-blue-600 active:scale-95'}`}>
                      <Check size={20} /> Check All
                    </button>
                  </div>
                </div>

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
